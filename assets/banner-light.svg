<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="236" viewBox="0 0 1280 236" role="img" aria-label="Le An Khanh — Software Engineer · Odoo ERP · DevOps · Applied AI">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <pattern id="grid-light" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94A3B8" stroke-width="0.6" opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Main Card -->
  <rect x="1" y="1" width="1278" height="234" rx="16" fill="url(#bg-light)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Architectural Grid Overlay (Right Half) -->
  <rect x="740" y="14" width="526" height="208" rx="12" fill="url(#grid-light)"/>

  <!-- Minimalist Solution Architecture Diagram (Right) -->
  <g transform="translate(843, 30)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <!-- Connection Lines -->
    <path d="M160 42 L160 66" stroke="#0284C7" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M160 110 L160 134" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="4 4"/>
    <circle cx="160" cy="54" r="3" fill="#0284C7"/>
    <circle cx="160" cy="122" r="3" fill="#4F46E5"/>

    <!-- Layer 1: AI & Automation -->
    <rect x="0" y="0" width="320" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
    <circle cx="22" cy="21" r="4.5" fill="#4F46E5"/>
    <text x="38" y="25.5" font-size="13" font-weight="700" fill="#0F172A">AI &amp; MCP INTEGRATION</text>
    <text x="300" y="25.5" text-anchor="end" font-size="11" fill="#64748B">LLM</text>

    <!-- Layer 2: ERP & Backend -->
    <rect x="0" y="66" width="320" height="44" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.6"/>
    <circle cx="22" cy="88" r="4.5" fill="#0284C7"/>
    <text x="38" y="92.5" font-size="13" font-weight="700" fill="#0F172A">ODOO ERP &amp; PYTHON</text>
    <text x="300" y="92.5" text-anchor="end" font-size="11" fill="#0284C7">CORE</text>

    <!-- Layer 3: Infrastructure & DevOps -->
    <rect x="0" y="134" width="320" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
    <circle cx="22" cy="155" r="4.5" fill="#0D9488"/>
    <text x="38" y="159.5" font-size="13" font-weight="700" fill="#0F172A">LINUX · DEVOPS · NET</text>
    <text x="300" y="159.5" text-anchor="end" font-size="11" fill="#64748B">OPS</text>
  </g>

  <!-- Accent Bar -->
  <rect x="68" y="58" width="42" height="3.5" rx="2" fill="url(#accent-light)"/>

  <!-- Eyebrow -->
  <text x="122" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.6" fill="#0284C7">
    SOFTWARE ENGINEER · SOLUTION ARCHITECTURE
  </text>

  <!-- Name -->
  <text x="68" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="0.5" fill="#0F172A">
    LÊ AN KHÁNH
  </text>

  <!-- Subtitle -->
  <text x="68" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#475569">
    Odoo ERP Architecture · Linux &amp; DevOps · Applied AI
  </text>
</svg>
