<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="236" viewBox="0 0 1280 236" role="img" aria-label="Le An Khanh — Software Engineer · Odoo ERP · DevOps · Applied AI">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#131F35"/>
    </linearGradient>
    <linearGradient id="accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid-dark" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Main Card -->
  <rect x="1" y="1" width="1278" height="234" rx="16" fill="url(#bg-dark)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Architectural Grid Overlay (Right Half) -->
  <rect x="740" y="14" width="526" height="208" rx="12" fill="url(#grid-dark)"/>

  <!-- Minimalist Solution Architecture Diagram (Right) -->
  <g transform="translate(843, 30)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <!-- Connection Lines -->
    <path d="M160 42 L160 66" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M160 110 L160 134" stroke="#818CF8" stroke-width="1.6" stroke-dasharray="4 4"/>
    <circle cx="160" cy="54" r="3" fill="#38BDF8"/>
    <circle cx="160" cy="122" r="3" fill="#818CF8"/>

    <!-- Layer 1: AI & Automation -->
    <rect x="0" y="0" width="320" height="42" rx="10" fill="#111C31" stroke="#26354D" stroke-width="1.4"/>
    <circle cx="22" cy="21" r="4.5" fill="#818CF8"/>
    <text x="38" y="25.5" font-size="13" font-weight="700" fill="#F1F5F9">AI &amp; MCP INTEGRATION</text>
    <text x="300" y="25.5" text-anchor="end" font-size="11" fill="#94A3B8">LLM</text>

    <!-- Layer 2: ERP & Backend -->
    <rect x="0" y="66" width="320" height="44" rx="10" fill="#13223A" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="22" cy="88" r="4.5" fill="#38BDF8"/>
    <text x="38" y="92.5" font-size="13" font-weight="700" fill="#F8FAFC">ODOO ERP &amp; PYTHON</text>
    <text x="300" y="92.5" text-anchor="end" font-size="11" fill="#38BDF8">CORE</text>

    <!-- Layer 3: Infrastructure & DevOps -->
    <rect x="0" y="134" width="320" height="42" rx="10" fill="#111C31" stroke="#26354D" stroke-width="1.4"/>
    <circle cx="22" cy="155" r="4.5" fill="#2DD4BF"/>
    <text x="38" y="159.5" font-size="13" font-weight="700" fill="#F1F5F9">LINUX · DEVOPS · NET</text>
    <text x="300" y="159.5" text-anchor="end" font-size="11" fill="#94A3B8">OPS</text>
  </g>

  <!-- Accent Bar -->
  <rect x="68" y="58" width="42" height="3.5" rx="2" fill="url(#accent-dark)"/>

  <!-- Eyebrow -->
  <text x="122" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.6" fill="#38BDF8">
    SOFTWARE ENGINEER · SOLUTION ARCHITECTURE
  </text>

  <!-- Name -->
  <text x="68" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="0.5" fill="#F8FAFC">
    LÊ AN KHÁNH
  </text>

  <!-- Subtitle -->
  <text x="68" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#94A3B8">
    Odoo ERP Architecture · Linux &amp; DevOps · Applied AI
  </text>
</svg>
