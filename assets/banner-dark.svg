<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Le An Khanh — Software Engineer · Odoo ERP · DevOps · AI Integration">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#131F35"/>
    </linearGradient>
    <linearGradient id="accent-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid-dark" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Main Card -->
  <rect x="1" y="1" width="1278" height="298" rx="16" fill="url(#bg-dark)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Architectural Grid Overlay (Right Half) -->
  <rect x="700" y="16" width="564" height="268" rx="12" fill="url(#grid-dark)"/>

  <!-- Minimalist Solution Architecture Diagram (Right) -->
  <g transform="translate(835, 48)" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, Monaco, monospace">
    <!-- Connection Lines -->
    <path d="M180 46 L180 78" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M180 126 L180 158" stroke="#818CF8" stroke-width="1.6" stroke-dasharray="4 4"/>
    <circle cx="180" cy="62" r="3" fill="#38BDF8"/>
    <circle cx="180" cy="142" r="3" fill="#818CF8"/>

    <!-- Layer 1: AI & Automation -->
    <rect x="30" y="0" width="300" height="46" rx="10" fill="#111C31" stroke="#26354D" stroke-width="1.4"/>
    <circle cx="52" cy="23" r="5" fill="#818CF8"/>
    <text x="68" y="27" font-size="13" font-weight="700" fill="#F1F5F9">AI &amp; MCP INTEGRATION</text>
    <text x="278" y="27" font-size="11" fill="#94A3B8">LLM</text>

    <!-- Layer 2: ERP & Backend -->
    <rect x="30" y="78" width="300" height="48" rx="10" fill="#13223A" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.6"/>
    <circle cx="52" cy="102" r="5" fill="#38BDF8"/>
    <text x="68" y="106" font-size="13" font-weight="700" fill="#F8FAFC">ODOO ERP &amp; PYTHON</text>
    <text x="272" y="106" font-size="11" fill="#38BDF8">CORE</text>

    <!-- Layer 3: Infrastructure & DevOps -->
    <rect x="30" y="158" width="300" height="46" rx="10" fill="#111C31" stroke="#26354D" stroke-width="1.4"/>
    <circle cx="52" cy="181" r="5" fill="#2DD4BF"/>
    <text x="68" y="185" font-size="13" font-weight="700" fill="#F1F5F9">LINUX · DEVOPS · NET</text>
    <text x="276" y="185" font-size="11" fill="#94A3B8">OPS</text>
  </g>

  <!-- Accent Bar -->
  <rect x="68" y="48" width="48" height="3.5" rx="2" fill="url(#accent-dark)"/>

  <!-- Eyebrow -->
  <text x="128" y="54" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.8" fill="#38BDF8">
    SOFTWARE ENGINEER · SOLUTION ARCHITECTURE
  </text>

  <!-- Name -->
  <text x="68" y="124" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="0.6" fill="#F8FAFC">
    LÊ AN KHÁNH
  </text>

  <!-- Subtitle -->
  <text x="68" y="164" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Odoo ERP Systems · DevOps &amp; Infrastructure · Applied AI
  </text>

  <!-- Minimalist Tech Pills -->
  <g transform="translate(68, 204)" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="160" height="34" rx="17" fill="#152238" stroke="#263B59" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4" fill="#38BDF8"/>
    <text x="30" y="21.5" fill="#E2E8F0">Odoo &amp; Python</text>

    <rect x="172" y="0" width="170" height="34" rx="17" fill="#152238" stroke="#263B59" stroke-width="1.2"/>
    <circle cx="190" cy="17" r="4" fill="#2DD4BF"/>
    <text x="202" y="21.5" fill="#E2E8F0">Linux &amp; DevOps</text>

    <rect x="354" y="0" width="158" height="34" rx="17" fill="#152238" stroke="#263B59" stroke-width="1.2"/>
    <circle cx="372" cy="17" r="4" fill="#818CF8"/>
    <text x="384" y="21.5" fill="#E2E8F0">AI &amp; Agents</text>
  </g>
</svg>
